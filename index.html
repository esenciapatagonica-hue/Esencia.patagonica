<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Esencia Patagónica</title><style id="st">
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a66;--ac:#128c7e;--acx:#fff;--bd:#e4e2dc;--pr:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f1f0ec;--mu:#a09f99;--ac:#2bb5a3;--acx:#06201c;--bd:#33332f;--pr:#ff6b9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f1f0ec;--mu:#a09f99;--ac:#2bb5a3;--acx:#06201c;--bd:#33332f;--pr:#ff6b9a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
.w{max-width:960px;margin:0 auto;padding:0 14px}
header{padding:22px 0 8px}h1{margin:0;font-size:26px}.sub{color:var(--mu);margin:4px 0 0;font-size:14px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.card.off{opacity:.5}.em{font-size:46px;text-align:center;line-height:1.2}
.nm{font-weight:600}.ds{color:var(--mu);font-size:14px;flex:1}
.pr{font-size:19px;font-weight:700}.old{color:var(--mu);text-decoration:line-through;font-size:14px;margin-right:6px;font-weight:400}
.tag{position:absolute;top:10px;left:10px;background:var(--pr);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:6px 10px;font-size:13px}.btn.d{background:transparent;color:var(--pr);border:1px solid var(--bd)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty b{min-width:22px;text-align:center}
.adm{background:var(--ac);color:var(--acx);padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.adm .w{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.adm .btn{background:var(--acx);color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar .btn{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.sh label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
.im{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#fff}
.emp{text-align:center;color:var(--mu);padding:40px 0}

const S=JSON.parse(document.getElementById('data').textContent);
let admin=false,dirty=false,cat='Todos',q='',cart={},view=null,ed=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const eff=p=>p.promo>0&&p.promo<p.price?p.promo:p.price;
const cats=()=>['Todos',...new Set(S.items.map(p=>p.cat||'General'))];
function render(){
 const list=S.items.filter(p=>(admin||p.on)&&(cat==='Todos'||p.cat===cat)&&(p.name+' '+p.desc).toLowerCase().includes(q.toLowerCase()));
 const n=Object.values(cart).reduce((a,b)=>a+b,0);
 const tot=S.items.reduce((a,p)=>a+(cart[p.id]||0)*eff(p),0);
 let h='';
 if(admin)h+=`<div class="adm"><div class="w"><b>Modo administrador</b><button class="btn s" onclick="openEd()">+ Producto</button><button class="btn s" onclick="view='imp';render()">Importar lista</button><button class="btn s" onclick="view='cfg';render()">Ajustes</button><button class="btn s" onclick="pub()">${dirty?'Guardar archivo ●':'Guardar archivo'}</button></div></div>`;
 h+=`<div class="w"><header><h1>${esc(S.biz.name)}</h1><p class="sub">${esc(S.biz.note)}</p></header>
 <input id="q" placeholder="Buscar producto…" value="${esc(q)}" oninput="q=this.value;render();document.getElementById('q').focus()">
 <div class="chips">${cats().map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${esc(c).replace(/&#39;/g,'')}';render()">${esc(c)}</button>`).join('')}</div>
 <div class="grid">${list.map(card).join('')}</div>${list.length?'':'<div class="emp">No hay productos para mostrar.</div>'}</div>`;
 if(n)h+=`<div class="bar"><button class="btn" onclick="view='cart';render()">Ver pedido (${n}) · ${money(tot)}</button></div>`;
 if(view==='cart')h+=cartSheet(tot);
 if(view==='cfg')h+=cfgSheet();
 if(view==='imp')h+=impSheet();
 if(view==='ed')h+=edSheet();
 $('#app').innerHTML=h;
}
function card(p){
 const q=cart[p.id]||0,promo=eff(p)<p.price,free=eff(p)<=0;
 return `<div class="card ${p.on?'':'off'}">${promo?`<span class="tag">OFERTA</span>`:''}${p.img?`<img class="im" alt="${esc(p.name)}" src="${esc(p.img)}">`:`<div class="em">${esc(p.emoji||'🛍️')}</div>`}
 <div class="nm">${esc(p.name)}</div><div class="ds">${esc(p.desc)}</div>
 <div class="pr">${promo?`<span class="old">${money(p.price)}</span>`:''}${free?'<span style="font-size:15px;color:var(--mu)">Consultar precio</span>':money(eff(p))}</div>
 ${admin?`<div class="row"><button class="btn g s" onclick="openEd('${p.id}')">Editar</button><button class="btn g s" onclick="tog('${p.id}')">${p.on?'Ocultar':'Mostrar'}</button><button class="btn d s" onclick="del('${p.id}')">Borrar</button></div>`:''}
 ${free?`<button class="btn g" onclick="ask('${p.id}')">Consultar por WhatsApp</button>`:q?`<div class="qty"><button class="btn g s" onclick="add('${p.id}',-1)">−</button><b>${q}</b><button class="btn s" onclick="add('${p.id}',1)">+</button></div>`:`<button class="btn" onclick="add('${p.id}',1)">Agregar</button>`}</div>`;
}
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(view==='cart'&&!Object.keys(cart).length)view=null;render()}
function cartSheet(tot){
 const ls=S.items.filter(p=>cart[p.id]);
 return `<div class="ov" onclick="if(event.target===this){view=null;render()}"><div class="sh"><h2 style="margin:0">Tu pedido</h2>
 ${ls.map(p=>`<div class="line"><span>${cart[p.id]} × ${esc(p.name)}</span><b>${money(cart[p.id]*eff(p))}</b></div>`).join('')}
 <div class="line"><b>Total</b><b>${money(tot)}</b></div>
 <div><label>Tu nombre (opcional)</label><input id="cn"></div>
 <button class="btn" onclick="send()">Enviar pedido por WhatsApp</button><button class="btn g" onclick="view=null;render()">Seguir viendo</button></div></div>`;
}
function send(){
 const nm=($('#cn')||{}).value||'';
 const t='Hola! Quiero hacer este pedido'+(nm?' (a nombre de '+nm+')':'')+':\n'+S.items.filter(p=>cart[p.id]).map(p=>'• '+cart[p.id]+' x '+p.name+' - '+money(cart[p.id]*eff(p))).join('\n')+'\nTotal: '+money(S.items.reduce((a,p)=>a+(cart[p.id]||0)*eff(p),0));
 const num=(S.biz.wa||'').replace(/\D/g,'');
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(t),'_blank');
}
function cfgSheet(){return `<div class="ov"><div class="sh"><h2 style="margin:0">Ajustes</h2>
 <div><label>Nombre del negocio</label><input id="c1" value="${esc(S.biz.name)}"></div>
 <div><label>Mensaje debajo del nombre</label><input id="c2" value="${esc(S.biz.note)}"></div>
 <div><label>Tu WhatsApp (con código de país, ej: 5492991234567)</label><input id="c3" value="${esc(S.biz.wa)}"></div>
 <button class="btn" onclick="S.biz={name:$('#c1').value,note:$('#c2').value,wa:$('#c3').value};dirty=true;view=null;render()">Guardar</button>
 <button class="btn g" onclick="view=null;render()">Cancelar</button></div></div>`}
function openEd(id){ed=id?{...S.items.find(p=>p.id===id)}:{id:'p'+Date.now(),name:'',desc:'',price:0,promo:0,cat:'General',emoji:'🛍️',on:true,isNew:true};view='ed';render()}
function edSheet(){const p=ed;return `<div class="ov"><div class="sh"><h2 style="margin:0">${p.isNew?'Nuevo producto':'Editar producto'}</h2>
 <div><label>Foto del producto</label><div id="ip" style="margin-bottom:8px">${ipHtml(p)}</div><input id="ef" type="file" accept="image/*" onchange="pickImg(this)">
 <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="e7" type="checkbox" style="width:auto"> Usar la misma foto en todos los productos de la categoría</label></div>
 <div><label>Nombre</label><input id="e1" value="${esc(p.name)}"></div>
 <div><label>Descripción</label><input id="e2" value="${esc(p.desc)}"></div>
 <div class="row"><div style="flex:1"><label>Precio</label><input id="e3" type="number" inputmode="numeric" value="${p.price}"></div>
 <div style="flex:1"><label>Precio promo (0 = sin promo)</label><input id="e4" type="number" inputmode="numeric" value="${p.promo}"></div></div>
 <div class="row"><div style="flex:1"><label>Categoría</label><input id="e5" value="${esc(p.cat)}"></div>
 <div style="flex:1"><label>Emoji / ícono</label><input id="e6" value="${esc(p.emoji)}"></div></div>
 <button class="btn" onclick="saveEd()">Guardar</button><button class="btn g" onclick="view=null;render()">Cancelar</button></div></div>`}
function saveEd(){
 const p={...ed,name:$('#e1').value.trim(),desc:$('#e2').value.trim(),price:+$('#e3').value||0,promo:+$('#e4').value||0,cat:$('#e5').value.trim()||'General',emoji:$('#e6').value.trim()||'🛍️'};
 if(!p.name){alert('Poné un nombre');return}
 const isNew=p.isNew;delete p.isNew;
 if(isNew)S.items.push(p);else S.items=S.items.map(x=>x.id===p.id?p:x);
 if($('#e7')&&$('#e7').checked&&p.img)S.items.forEach(x=>{if(x.cat===p.cat)x.img=p.img});
 dirty=true;view=null;render();
}
function tog(id){const p=S.items.find(x=>x.id===id);p.on=!p.on;dirty=true;render()}
function del(id){if(confirm('¿Borrar este producto?')){S.items=S.items.filter(x=>x.id!==id);dirty=true;render()}}
function build(){
 const j=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.biz.name)+'</title><style id="st">'+$('#st').textContent+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+j+'<\/script><script id="js">'+$('#js').textContent+'<\/script></body></html>';
}
function pub(){const b=new Blob([build()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();dirty=false;render();alert('Listo. Se descargó index.html. Subilo a Netlify para actualizar el catálogo de tus clientes.')}

const EMO=[[/aceite|aceituna/i,'🫒'],[/pepinillo|salmuera/i,'🥒'],[/chimichurri/i,'🌿'],[/pasta/i,'🥫'],[/mix|fruto/i,'🥜'],[/berenjena/i,'🍆'],[/poroto/i,'🫘'],[/matambre|cordero|pollo|conejo|llama/i,'🥩'],[/botell/i,'🍾']];
const emo=n=>{const e=EMO.find(x=>x[0].test(n));return e?e[1]:'🛍️'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parseList(t){let bad=0;const out=[];let cur=null;
 const flush=()=>{if(!cur)return;if(cur.v.length)cur.v.forEach(v=>out.push({name:cur.name+' – '+cap(v),price:cur.price,cat:cur.name}));else out.push({name:cur.name,price:cur.price,cat:''});cur=null};
 t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
  const bm=l.match(/^[•·*\-–]\s+(.+)$/),s=bm?bm[1]:l;
  const m=s.match(/^(.*?)[\s:;\-–—|$]*\$?\s*(\d[\d.,]*)\s*(?:\$|ars|pesos)?\s*$/i);
  const nm=m&&m[1].replace(/[\s:;\-–—|$]+$/,'').trim();
  if(bm&&cur&&!(m&&nm)){cur.v.push(s);return}
  if(!m||!nm){bad++;return}
  flush();let n=m[2];
  n=/,\d{1,2}$/.test(n)?n.replace(/\./g,'').replace(',','.'):n.replace(/[.,]/g,'');
  cur={name:cap(nm),price:parseFloat(n)||0,v:[]}});
 flush();return{ok:out,bad}}
function impSheet(){return `<div class="ov"><div class="sh"><h2 style="margin:0">Importar lista de precios</h2>
<p class="sub" style="margin:0">Pegá un producto por línea con su precio, por ejemplo: Aceite 500 ML: $ 14.000. Si debajo ponés variantes con viñeta (• Limón), se crea un producto por cada una con el mismo precio. Precio $ 0 = "Consultar precio".</p>
<textarea id="i1" rows="8" oninput="impPrev()"></textarea>
<div><label>Categoría para productos sin variantes</label><input id="i2" value="General"></div>
<label style="display:flex;gap:8px;align-items:center"><input id="i3" type="checkbox" style="width:auto"> Reemplazar los productos actuales</label>
<div id="i4" class="sub"></div>
<button class="btn" onclick="doImp()">Importar</button><button class="btn g" onclick="view=null;render()">Cancelar</button></div></div>`}
function impPrev(){const r=parseList($('#i1').value);$('#i4').textContent=r.ok.length+' productos detectados'+(r.bad?' · '+r.bad+' líneas ignoradas':'')}
function doImp(){const r=parseList($('#i1').value);if(!r.ok.length){alert('No se detectó ningún producto con precio.');return}
 const c=$('#i2').value.trim()||'General';if($('#i3').checked)S.items=[];
 let nu=0,up=0;r.ok.forEach((x,i)=>{const e=S.items.find(p=>p.name.toLowerCase()===x.name.toLowerCase());
  if(e){e.price=x.price;up++}else{S.items.push({id:'p'+Date.now()+i,name:x.name,desc:'',price:x.price,promo:0,cat:x.cat||c,emoji:emo(x.name),on:true});nu++}});
 dirty=true;view=null;cat='Todos';render();alert(nu+' productos nuevos, '+up+' con precio actualizado. Revisalos y tocá Guardar archivo.')}
function ask(id){const p=S.items.find(x=>x.id===id);window.open('https://wa.me/'+(S.biz.wa||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Hola! Quiero consultar por '+p.name),'_blank')}

function ipHtml(p){return p.img?`<img class="im" style="max-width:150px" src="${esc(p.img)}" alt=""> <button class="btn d s" onclick="ed.img='';document.getElementById('ip').innerHTML=ipHtml(ed)">Quitar foto</button>`:'<div class="sub">Sin foto: se muestra el ícono.</div>'}
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
   ed.img=c.toDataURL('image/jpeg',0.72);document.getElementById('ip').innerHTML=ipHtml(ed)};
  im.onerror=()=>alert('No se pudo leer esa imagen. Probá con un JPG o PNG.');im.src=r.result};
 r.readAsDataURL(f)}
function chk(){admin=location.hash==='#admin';render()}
addEventListener('hashchange',chk);chk();
</script></body></html>
